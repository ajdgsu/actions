runs:
  using: "composite"
  steps:
    - name: Install LLVM
      shell: bash
      run: |
        export PATH="/opt/clang/bin:$PATH"
        echo "/opt/clang/bin" >> $GITHUB_PATH
        mkdir /opt/clang
        wget -q https://github.com/ajdgsu/clang-19-x86-64-v3-mlgo/releases/download/clang/clang-19.1.7.tar.xz
        sudo tar --strip-components=1 -C /opt/clang -xf clang-19.1.7.tar.xz
        rm -rf clang-19.1.7.tar.xz
        clang --version
